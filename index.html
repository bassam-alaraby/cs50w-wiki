<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Encyclopedia</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="row">
            <nav class="navbar navbar-expand-lg bg-body-tertiary wiki-navbar">
                <div class="container-fluid wiki-navbar-content">
                    <a class="navbar-brand" href="#/">Wiki</a>

                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarSupportedContent"
                            aria-controls="navbarSupportedContent"
                            aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="#/new">
                                    Create New Page
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#/random">
                                    Random Page
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#/" id="reset-demo">
                                    Reset Demo
                                </a>
                            </li>
                        </ul>

                        <form id="search-form" class="d-flex" role="search">
                            <input class="form-control me-2" type="text" name="q" id="search-input"
                                placeholder="Search Encyclopedia" aria-label="Search">
                            <button class="btn btn-outline-primary" type="submit">
                                Search
                            </button>
                        </form>
                    </div>
                </div>
            </nav>

            <main class="main col-lg-10 col-md-9">
                <div class="alert alert-warning">
                    Static simulation: this demo runs entirely in your browser and saves changes only to this
                    browser's localStorage, so nothing is shared between visitors or written back
                    to the repository.
                </div>

                <div id="app">
                    <div class="alert alert-info" role="status">Loading Encyclopedia...</div>
                </div>
            </main>
        </div>

        <div id="library-error" class="container mt-3"></div>

        <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="app.js" defer></script>
    </body>
</html>
