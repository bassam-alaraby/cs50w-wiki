{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia - Page Not Found
{% endblock %}

{% block body %}
    <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 65vh;">
        <h1 class="display-1 fw-light text-secondary opacity-25 mb-2">404</h1>
        <p class="fs-4 fw-light text-body-secondary mb-4">{{ error_message }}</p>
        <a href="{% url 'index' %}" class="btn btn-outline-primary px-4 py-2">Back to Wiki</a>
    </div>

{% endblock %}
