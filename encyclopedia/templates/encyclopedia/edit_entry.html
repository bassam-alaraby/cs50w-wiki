{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia - Edit {{ title }}
{% endblock %}

{% block body %}
    <h2>Edit {{ title }}</h2>
    <form action="{% url 'edit_entry' title %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="entry_content" class="form-label">Entry Content:</label>
            <textarea class="form-control" id="entry_content" name="content">{{ content }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Entry</button>
    </form>

{% endblock %}
