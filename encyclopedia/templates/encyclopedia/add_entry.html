{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia - Add New Entry
{% endblock %}

{% block body %}
    <h2>Add New Entry</h2>
    {% if error_message %}
    <h2>{{ error_message }}</h2>
    {% endif %}
    <form action="{% url 'add_entry' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="entry_title" class="form-label">Entry Title:</label>
            <input type="text" class="form-control" id="entry_title" name="title" value="{% if title %}{{ title }}{% endif %}">
        </div>
        <div class="mb-3">
            <label for="entry_content" class="form-label">Entry Content:</label>
            <textarea class="form-control" id="entry_content" name="content"
                    placeholder="Write your Markdown content here...">{% if content %}{{ content }}{% endif %}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Entry</button>
    </form>

{% endblock %}
