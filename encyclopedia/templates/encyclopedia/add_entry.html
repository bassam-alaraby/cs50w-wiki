{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>Add New Entry</h1>
    {% if error_message %}
    <h2>{{ error_message }}</h2>
    {% endif %}
    <form action="{% url 'add_entry' %}" method="post">
        {% csrf_token %}
        <label for="entry_title">Entry Title:</label>
        <input type="text" id="entry_title" name="title" value="{% if title %}{{ title }}{% endif %}">

        <label for="entry_content">Entry Content:</label>
        <textarea id="entry_content" name="content" rows="15" cols="60"
                placeholder="Write your Markdown content here...">{% if content %}{{ content }}{% endif %}</textarea>

        <button type="submit">Save Entry</button>
    </form>

{% endblock %}
